<div class="container">
  <div>
  <h2>Modifier un Equipe :</h2>
  </div>
  <form >
  <div hidden class="col-sm-2 col-md-2 col-lg-2">
  <label >ID Equipe</label>
  <input type="text" [(ngModel)]="currentEquipe.idEquipe"
  name="idEquipe" class="form-control">
  </div>
  <div class="col-sm-4 col-md-4 col-lg-4" >
    <label >Nom Equipe</label>
    <input type="text"[(ngModel)]= "currentEquipe.nomEquipe"
    name="nomEquipe" class="form-control">
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
    <label >Prix Equipe</label>
    <input type="number" [(ngModel)]= "currentEquipe.budgetAnnuel"
    name="prixEquipe" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4" >
      <label >Nom Terrain</label>
      <input type="text"[(ngModel)]= "currentEquipe.nomTerrain"
      name="nomTerrain" class="form-control">
      </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
    <label >Date création</label>
    <input type="date" [ngModel]="currentEquipe.dateRealisation | date: 'yyyy-MM-dd'"
    (ngModelChange)=" currentEquipe.dateRealisation= $event" name="dateCreation"
     class="form-control">
    </div>
    <select class="form-control form-control-lg" id="idLeg" name="idLeg"
      [(ngModel)]="updatedIdLeg">
      @for(league of leagues; track league.idLeg)
      {
      <option [value]="league.idLeg"> {{league.nomLeg}} </option>
      }
      </select>
    <div class="mt-2">
    <button type="submit" (click)="updateEquipe()" class="btn btn-success">Modifer</button>
    </div>
    </form>
    </div>
